name: Consolidate dependency updates

on:
    workflow_dispatch:

permissions:
    contents: write

jobs:
    update:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.ref_name }}

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.5"
                  tools: composer

            - name: Update root dependencies
              run: composer update --with-all-dependencies --no-interaction --no-progress

            - name: Update tools/php-cs-fixer
              run: composer update --with-all-dependencies --no-interaction --no-progress -d tools/php-cs-fixer

            - name: Update tools/phpstan
              run: composer update --with-all-dependencies --no-interaction --no-progress -d tools/phpstan

            - name: Update tools/rector
              run: composer update --with-all-dependencies --no-interaction --no-progress -d tools/rector

            - name: Verify
              run: |
                  composer validate --strict
                  php bin/check-symfony-lock.php
                  composer audit

            - name: Commit
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add composer.lock tools/php-cs-fixer/composer.lock tools/phpstan/composer.lock tools/rector/composer.lock
                  git commit -m "chore(deps): refresh composer lockfiles"
                  git push origin HEAD:${{ github.ref_name }}
